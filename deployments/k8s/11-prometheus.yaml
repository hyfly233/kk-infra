# Prometheus 部署（R2-3：推理 + GPU 指标抓取）
# 生产环境通常使用已有 Prometheus/kube-prometheus-stack，此处为本地验证参考
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: carrot-observability
        static_configs:
          - targets: [observability.carrot-ai.svc.cluster.local:8084]
      # DCGM Exporter：GPU 指标
      - job_name: dcgm
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: dcgm-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: "${1}:9400"
      # 模型服务：vLLM 指标（/metrics）
      - job_name: vllm
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_carrot_ai_managed_by]
            regex: carrot
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_carrot_ai_deployment_id]
            target_label: deployment_id
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=7d
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: prometheus-config
              - configMap:
                  name: prometheus-alert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
