apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: monitoring
data:
  alerts.yml: |
    groups:
      - name: carrot-cluster-health
        rules:
          - alert: ClusterAgentOffline
            expr: carrot_cluster_alert{kind="offline"} == 1
            labels:
              severity: critical
            annotations:
              summary: "集群 {{ $labels.cluster_id }} 超过 90 秒未收到心跳"
          - alert: ClusterCapacityUnhealthy
            expr: carrot_cluster_alert{kind="unhealthy"} == 1
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "集群 {{ $labels.cluster_id }} 容量采集或节点健康异常"
          - alert: ClusterTelemetryUnavailable
            expr: carrot_cluster_alert{kind="telemetry"} == 1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "集群 {{ $labels.cluster_id }} Prometheus/DCGM 遥测不可用"
          - alert: ClusterMonitorScrapeFailed
            expr: up{job="carrot-cluster-monitor"} == 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "集群告警指标抓取失败，请检查控制面连通性及监控 token 到期时间"
      - name: carrot-inference-guards
        rules:
          - alert: HighInferenceErrorRate
            expr: sum by (tenant_id, deployment_id) (rate(carrot_inference_errors_total[5m])) / clamp_min(sum by (tenant_id, deployment_id) (rate(carrot_inference_requests_total[5m])), 0.001) > 0.05
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "部署 {{ $labels.deployment_id }} 错误率超过 5%"
          - alert: HighInferenceTTFT
            expr: avg_over_time(carrot_inference_ttft_ms[10m]) > 2000
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "部署 {{ $labels.deployment_id }} TTFT 超过 2 秒"
          - alert: HighInferenceTPOT
            expr: avg_over_time(carrot_inference_tpot_ms[10m]) > 100
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "部署 {{ $labels.deployment_id }} TPOT 持续偏高"
          - alert: InferenceQueueBacklog
            expr: max_over_time(carrot_inference_queue_length[5m]) > 20
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "部署 {{ $labels.deployment_id }} 队列持续积压"
          - alert: KVCachePressure
            expr: max_over_time(carrot_inference_kv_cache_usage_ratio[10m]) > 0.90
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "部署 {{ $labels.deployment_id }} KV cache 使用率超过 90%"
          - alert: GPUUtilizationHigh
            expr: avg by (instance) (dcgm_gpu_utilization) > 95
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "GPU {{ $labels.instance }} 利用率超过 95%"
